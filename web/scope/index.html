<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swarmscope</title>
<meta name="description" content="Try a change on simulated customers before trying it on real ones: see where people wait, where they walk away, and whether the change helps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <a class="brand" href="./" aria-label="Swarmscope, reload">Swarmscope</a>
    <form class="ask" id="askForm" autocomplete="off">
      <label class="visually-hidden" for="askIn">What do you want to find out?</label>
      <input id="askIn" type="text" placeholder="Ask about this place, for example: where do people give up at lunch?" spellcheck="false">
      <button class="btn" id="askBtn" type="submit">Simulate</button>
      <div class="ask-card" id="askCard" hidden></div>
    </form>
    <button class="btn quiet" id="langBtn" type="button" data-i18n-skip lang="zh-Hans" aria-label="切换到简体中文">中文</button>
    <button class="btn quiet icon" id="themeBtn" type="button" aria-label="Switch to dark theme"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="7.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.8a7.2 7.2 0 0 1 0 14.4z" fill="currentColor"/></svg></button>
  </header>

  <main class="stage">
    <section class="mapcol" aria-label="Simulation map">
      <div class="maphead">
        <div class="place">
          <h1 id="placeTitle">Loading</h1>
          <p id="placeSub" class="question"></p>
        </div>
        <div class="headtools">
          <div class="floors" id="floorTabs" role="tablist" aria-label="Floors" hidden></div>
          <p class="runnote" id="runNote"></p>
          <button class="btn small" id="detailsBtn" type="button" aria-expanded="false" aria-controls="drawer">Run details</button>
        </div>
      </div>

      <div class="mapbox" id="mapbox">
        <canvas id="map" tabindex="0" role="application" aria-label="Map of the place with people and incidents. Press Enter to pick a person, the arrow keys to move between people, and Enter again to see what they did." aria-describedby="mapKeys"></canvas>
        <div class="map-corner" id="mapTools" hidden>
          <button type="button" class="btn small" id="resetView" hidden>Reset view</button>
          <button type="button" class="btn small" id="editBtn" hidden aria-pressed="false">Edit the room</button>
          <button type="button" class="btn small" id="viewBtn" aria-expanded="false" aria-controls="viewMenu">View</button>
          <div class="menu" id="viewMenu" hidden>
            <fieldset>
              <legend>Color people by</legend>
              <label><input type="radio" name="colorBy" value="state" checked> What they are doing</label>
              <label><input type="radio" name="colorBy" value="archetype"> Group</label>
              <label><input type="radio" name="colorBy" value="frustration" aria-describedby="frustrationWhy"> How frustrated they are</label>
              <p class="menu-note" id="frustrationWhy" hidden>Needs a run decided by Jev. The rule model does not record how people feel.</p>
            </fieldset>
            <fieldset>
              <legend>Show</legend>
              <label><input type="checkbox" data-layer="heat" checked> Where trouble builds up</label>
              <label><input type="checkbox" data-layer="agents" checked> People</label>
              <label><input type="checkbox" data-layer="labels" checked> Counter names</label>
            </fieldset>
          </div>
        </div>
        <div class="callout" id="callout" hidden></div>
        <div class="legend-mini" id="legendMini" hidden></div>
        <p class="map-keys" id="mapKeys">Enter picks a person. Arrow keys move between people. Enter opens them. Escape lets go.</p>
        <div class="empty" id="emptyState"><p class="lead">Loading the simulation…</p></div>
        <div class="notice" id="notice" role="alert" hidden></div>
        <div class="progress" id="progress" hidden aria-live="polite"></div>
        <aside class="tour" id="tour" hidden aria-label="3D tour">
          <div class="tour-head">
            <p id="tourTitle">3D tour</p>
            <button class="btn ghost small" id="tourClose" type="button">Close</button>
          </div>
          <div class="tour-body" id="tourBody"></div>
        </aside>
      </div>

      <div class="timeline" id="timeline" hidden>
        <div class="track">
          <canvas id="hist" aria-hidden="true"></canvas>
          <input type="range" id="scrub" min="0" max="1" step="any" value="0" aria-label="Simulation time">
        </div>
        <div class="controls">
          <button class="btn play" id="playBtn" type="button" aria-label="Play"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path id="playIcon" d="M6 4l10 6-10 6z" fill="currentColor"/></svg></button>
          <div class="seg" role="group" aria-label="Playback speed">
            <button type="button" data-speed="1" aria-pressed="false">1×</button>
            <button type="button" data-speed="4" aria-pressed="true">4×</button>
            <button type="button" data-speed="16" aria-pressed="false">16×</button>
          </div>
          <p class="clock" id="clock" aria-live="off">--:--</p>
          <p class="span" id="span"></p>
        </div>
      </div>
    </section>

    <aside class="side idle" id="side" aria-label="What the simulation shows">
      <section class="verdict" id="verdict" aria-label="Did the change help?" aria-live="polite"></section>
      <section class="edit-panel" id="editPanel" hidden aria-label="Edit the room"></section>
      <section class="counters" id="counters" aria-label="Right now"></section>
      <div class="side-body" id="sideBody">
        <section class="block">
          <div class="block-head">
            <h2>Bottlenecks</h2>
            <div class="seg small" id="rankMode" role="group" aria-label="Bottleneck measure">
              <button type="button" data-mode="total" aria-pressed="true">So far</button>
              <button type="button" data-mode="now" aria-pressed="false">Right now</button>
            </div>
          </div>
          <p class="hint rank-hint" id="rankHint"></p>
          <ol class="rank" id="rank"></ol>
        </section>
        <section class="block grow">
          <div class="block-head"><h2>Incidents</h2><div class="filters" id="feedFilters" role="group" aria-label="Incident types"></div></div>
          <ol class="feed" id="feed"></ol>
        </section>
      </div>
      <section class="inspector" id="inspector" hidden aria-label="One person"></section>
    </aside>
  </main>

  <aside class="drawer" id="drawer" hidden aria-label="Run details">
    <div class="drawer-head">
      <h2>Run details</h2>
      <button class="btn quiet small" id="drawerClose" type="button">Close</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
  <p class="visually-hidden" id="live" aria-live="polite"></p>
</div>
</body>
</html>
